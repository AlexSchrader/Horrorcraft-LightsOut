# Lights Out plugin config.

# The plugin only runs when the main world has this name; anything else disables it,
# so it can never act on the Polis world.
world: lightsout

# Chat reaches players within this many blocks (same world).
chat-radius: 24

# Health (20 = full) for each number of lives left.
health:
  '3': 20.0
  '2': 13.0
  '1': 6.0

# Minimum time between two counted killer hits on the same camper.
hit-spacing-ms: 1500

# Any camper hit on the killer rolls this chance of a stun.
stun:
  chance: 0.5
  seconds: 3

# Blood at 1/3 lives: a drip every drip-ticks, each drip visible for trail-seconds.
blood:
  drip-ticks: 10
  trail-seconds: 60

# Camera accounts (role camera): shot timing for the auto director and fixed cameras.
cameras:
  director-seconds: 2
  relock-seconds: 5
  min-shot-seconds: 8
  rotate-seconds: 60
  near-radius: 60
  chase-radius: 20
  body-hold-seconds: 10
  cue-seconds: 20

# Minecraft username -> actor id and role (camper, human, killer, police, camera).
# Cameras also get follow: auto, or the username they follow.
actors:
  ACSsnipertroll: {id: alex, role: human}
  Josh: {id: josh, role: camper}
  Dane: {id: dane, role: camper}
  Mara: {id: mara, role: camper}
  Tyler: {id: tyler, role: camper}
  Reyes: {id: reyes, role: police}
  Hale: {id: hale, role: police}
  Hollow: {id: killer, role: killer}
  Camera: {id: camera, role: camera, follow: auto}
  KillerCam: {id: killercam, role: camera, follow: Hollow}
  CamJosh: {id: camjosh, role: camera, follow: Josh}
  CamDane: {id: camdane, role: camera, follow: Dane}
  CamMara: {id: cammara, role: camera, follow: Mara}
  CamTyler: {id: camtyler, role: camera, follow: Tyler}
